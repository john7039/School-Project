server {
    listen 80 default_server;
    server_name _;
    root /var/www/econ;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # ⚠️ $remote_addr 는 **덮어쓴다**. Funnel 로 들어온 요청은 tailscaled 가
        #    127.0.0.1 로 넘겨주므로, tailscaled 가 넣어준 진짜 IP 가 있어도
        #    여기서 지워져 **모든 방문자가 127.0.0.1 한 명**이 됐다.
        #    $proxy_add_x_forwarded_for 는 **덧붙인다** — 앞에 진짜 IP 가 남는다.
        #    (채팅 속도 제한이 IP 별로 동작하려면 이게 필요하다.)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
